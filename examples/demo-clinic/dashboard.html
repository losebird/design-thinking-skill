<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目仪表盘 · 设计思维</title>
<style>
:root{--text:#2C2C2B;--muted:#7D7A75;--bg:#FFFFFF;--soft:#F9F8F7;--surface:#F0EFED;--border:#E6E5E3;
--blue:#2783DE;--blue-s:#E5F2FC;--green:#46A171;--green-s:#E8F1EC;--orange:#D5803B;--orange-s:#FBEBDE;--red:#E56458;--red-s:#FCE9E7;--purple:#9A6BC0;--purple-s:#F3ECF8;--yellow:#C9A227;--yellow-s:#FBF3DB;--teal:#3A9DAE;--teal-s:#E3F3F5;--pink:#C9658F;--pink-s:#FAE8F0}
@media (prefers-color-scheme:dark){:root{--text:#FFFFFF;--muted:rgba(255,255,255,.65);--bg:#191919;--soft:#202020;--surface:#383836;--border:rgba(255,255,255,.2);
--blue:#5E9FE8;--blue-s:rgba(94,159,232,.12);--green:#72BC8F;--green-s:rgba(114,188,143,.12);--orange:#DE9255;--orange-s:rgba(222,146,85,.12);--red:#E97366;--red-s:rgba(233,115,102,.12);--purple:#BF8EDA;--purple-s:rgba(191,142,218,.12);--yellow:#EAC26B;--yellow-s:rgba(234,194,107,.12);--teal:#4FB9C9;--teal-s:rgba(79,185,201,.12);--pink:#DF84A8;--pink-s:rgba(223,132,168,.12)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:24px 32px 48px}
/* 顶部导航栏（所有非仪表盘页面注入） */
#dt-nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:0;background:var(--bg);border-bottom:1px solid var(--border);padding:0 24px;height:40px;font-size:13.5px}
#dt-nav a{color:var(--muted);text-decoration:none;padding:0 10px;height:40px;display:flex;align-items:center;border-bottom:2px solid transparent}
#dt-nav a:hover{color:var(--text);background:var(--soft)}
#dt-nav .dt-nav-home{color:var(--blue);font-weight:600;padding-left:0}
#dt-nav .dt-nav-home:hover{background:var(--blue-s)}
#dt-nav .dt-nav-sep{flex:1}
#dt-nav .dt-nav-proj{font-size:12.5px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body:has(#dt-nav) .wrap{padding-top:16px}
.dt-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.dt-head h1{font-size:24px;margin:0;font-weight:650}
.dt-head h1 small{font-size:14px;color:var(--muted);font-weight:400;margin-left:8px}
.dt-head .sub{font-size:13.5px;color:var(--muted);margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
button:hover{background:var(--soft)}
button:focus-visible,[contenteditable]:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.ghost{border-style:dashed;color:var(--muted);font-size:13px;min-height:32px;padding:4px 10px}
button.icon{border:0;background:transparent;color:var(--muted);width:28px;height:28px;min-height:28px;padding:0;border-radius:6px;font-size:16px;line-height:1}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0}
.seg button[aria-pressed=true]{background:var(--surface);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--orange-s);color:var(--orange);font-weight:550;white-space:nowrap}
button.badge{border:0;min-height:0;cursor:pointer;font:inherit;font-size:12.5px;font-weight:550}button.badge:hover{filter:brightness(.96)}
.badge.ok{background:var(--green-s);color:var(--green)}
.badge.info{background:var(--blue-s);color:var(--blue)}
.badge.mute{background:var(--surface);color:var(--muted)}
.box{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--bg)}
.box.soft{background:var(--soft)}
.sec{font-size:17px;font-weight:650;margin:28px 0 4px}
.secsub{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.hint{font-size:12.5px;color:var(--muted)}
.card{position:relative;background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:8px 32px 8px 10px}
.card>.icon.del{position:absolute;top:4px;right:4px}
.ed{outline:none;min-height:1.4em;word-break:break-word}
.ed:empty:before{content:attr(data-ph);color:var(--muted)}
.ev{font-size:12px;border:0;padding:1px 8px;min-height:22px;border-radius:999px;cursor:pointer}
.ev.quote{background:var(--blue-s);color:var(--blue)}.ev.observed{background:var(--green-s);color:var(--green)}
.ev.inferred{background:var(--purple-s);color:var(--purple)}.ev.assumed{background:var(--orange-s);color:var(--orange)}
input,select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 8px;min-height:36px;max-width:100%}
textarea{resize:vertical}
.core{border-radius:12px;padding:16px 20px;background:var(--blue-s);border-left:4px solid var(--blue)}
.core .lbl{font-size:13px;color:var(--blue);font-weight:650;margin-bottom:4px}
.core .ed{font-size:16px;font-weight:550}
.verify{border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-top:16px}
.verify ul{margin:6px 0 0;padding-left:20px}.verify li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.open{display:flex}
.modal .panel{background:var(--bg);border-radius:12px;padding:20px;width:min(640px,100%);box-shadow:0 4px 24px rgba(0,0,0,.18)}
.modal textarea{width:100%;min-height:220px;font-family:Menlo,Consolas,monospace;font-size:12.5px}
.empty{color:var(--muted);font-size:14px;padding:12px;border:1px dashed var(--border);border-radius:8px;text-align:center}
.foot{margin-top:40px;font-size:12.5px;color:var(--muted);text-align:center}
.foot a{color:var(--muted)}
/* AI 辅助面板（desk research 等页面） */
.aip{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:20px 0 0;background:var(--soft)}
.aip-hd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px}
.aip-btns{display:flex;flex-wrap:wrap;gap:8px}
.aip-rv{border-color:var(--orange);color:var(--orange)}
.aip-box{display:none;margin:10px 0 0;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:13px/1.7 inherit;font-family:inherit;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.aip-box.open{display:block}
.srcs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px}
.src-chip{font-size:11.5px;min-height:22px;padding:0 8px;border-radius:999px;border:0;background:var(--blue-s);color:var(--blue)}
.src-chip.miss{background:var(--red-s);color:var(--red)}
.src-add{font-size:12px;min-height:24px;padding:0 4px;max-width:180px;color:var(--muted)}
@media (max-width:720px){.wrap{padding:16px}.dt-head h1{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── 启动页专用样式 ── */
.db-hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:16px 20px;border:1px solid var(--border);border-radius:14px;background:var(--bg);margin-bottom:16px}
.db-hero-title{font-size:22px;font-weight:750;line-height:1.2}
.db-hero-title small{font-size:14px;font-weight:400;color:var(--muted);display:block;margin-top:4px}
.db-hero-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}

/* 进度条 */
.db-progress{margin:12px 0 0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.db-ph{border-radius:8px;padding:8px 10px;border:2px solid transparent;cursor:default;background:var(--soft)}
.db-ph.cur{border-color:var(--c);background:var(--bg);box-shadow:0 0 0 1px var(--c)}
.db-ph-name{font-size:12.5px;font-weight:650;color:var(--c)}
.db-ph-bar{height:4px;border-radius:2px;background:var(--border);margin:5px 0 3px;overflow:hidden}
.db-ph-bar i{display:block;height:100%;border-radius:2px;background:var(--c)}
.db-ph-cnt{font-size:11px;color:var(--muted)}

/* 摘要数字 */
.db-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.db-stat{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--bg)}
.db-stat .v{font-size:24px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums}
.db-stat .l{font-size:12px;color:var(--muted);margin-top:3px}

/* ── 工具卡片网格 ── */
.db-phase-sec{margin-bottom:18px}
.db-phase-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.db-phase-hd h3{margin:0;font-size:15px;font-weight:700;color:var(--c)}
.db-phase-hd .ph-prog{font-size:12px;color:var(--muted)}
.db-tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}

.db-tool{border:1px solid var(--border);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .15s}
.db-tool:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.db-tool.has-data{border-left:3px solid var(--c)}
.db-tool-hd{display:flex;align-items:center;gap:8px;padding:9px 10px 6px}
.db-tool-name{font-size:13.5px;font-weight:650;flex:1}
.db-tool-badge{font-size:11px;padding:1px 7px;border-radius:10px;white-space:nowrap}
.has-data .db-tool-badge{background:var(--green-s);color:var(--green)}
.db-tool:not(.has-data) .db-tool-badge{background:var(--surface);color:var(--muted)}
.db-tool-preview{padding:0 10px 6px;font-size:12.5px;color:var(--muted);line-height:1.5;min-height:32px;flex:1}
.db-tool-preview b{color:var(--text);font-weight:600}
.db-tool-actions{display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--surface);flex-wrap:wrap}
.db-tool-actions a,.db-tool-actions button{font-size:12.5px;padding:3px 10px;min-height:28px;border-radius:6px}
.db-tool-actions a{color:var(--blue);border:1px solid var(--blue);text-decoration:none;display:inline-flex;align-items:center}
.db-tool-actions a:hover{background:var(--blue-s)}

/* ── 下一步 ── */
.db-next{border:2px solid var(--blue);border-radius:12px;padding:14px 16px;margin-bottom:16px;background:var(--blue-s)}
.db-next h3{margin:0 0 10px;font-size:15px;color:var(--blue)}
.db-next-items{display:flex;flex-direction:column;gap:8px}
.db-next-item{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--bg);border-radius:8px;padding:8px 10px;border:1px solid var(--border)}
.db-next-num{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.db-next-txt .t{font-size:13.5px;font-weight:600}
.db-next-txt .d{font-size:12.5px;color:var(--muted)}
.db-next-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.db-next-actions button{font-size:12px;min-height:26px;padding:2px 8px}
.db-next-actions a{font-size:12px;color:var(--blue);border:1px solid var(--blue);border-radius:6px;padding:2px 8px;text-decoration:none;display:inline-flex;align-items:center}

/* ── 待验证清单 ── */
.db-verify{margin-bottom:16px}
.db-verify-item{display:flex;align-items:flex-start;gap:8px;padding:6px 10px;border-radius:7px;font-size:13px;border-bottom:1px solid var(--surface)}
.db-verify-item:last-child{border:0}
.db-verify-item input{flex-shrink:0;margin-top:3px}
.db-verify-item.checked{opacity:.45;text-decoration:line-through}
.db-verify-src{font-size:11px;color:var(--muted);white-space:nowrap;margin-left:auto;padding-left:8px}

/* ── AI 工作流面板 ── */
.db-aipanel{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px}
.db-aipanel-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--border);cursor:pointer}
.db-aipanel-hd h3{margin:0;font-size:14px}
.db-aipanel-body{padding:12px 14px;display:none}
.db-aipanel.open .db-aipanel-body{display:block}
.db-aipanel.open .db-aipanel-toggle{transform:rotate(180deg)}
.db-aipanel-toggle{transition:transform .2s;font-size:16px}
.db-prompt-box{background:var(--surface);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;margin-top:8px;color:var(--text)}
.db-prompt-actions{display:flex;gap:8px;margin-top:8px}

@media(max-width:720px){
  .db-hero{grid-template-columns:1fr}.db-hero-actions{align-items:flex-start}
  .db-stats{grid-template-columns:1fr 1fr}.db-progress{grid-template-columns:1fr 1fr}
  .db-next-item{grid-template-columns:28px 1fr;gap:6px}.db-next-actions{grid-column:1/-1}
}
</style>
</head>

function collectVerify(s){
  const out=[];
  (function wk(o,p){if(!o||typeof o!=='object')return;for(const k in o){
    if(k==='toVerify'&&Array.isArray(o[k]))o[k].forEach(v=>out.push({t:typeof v==='string'?v:(v.text||''),src:p.split('.')[0]}));
    else wk(o[k],p?p+'.'+k:k);
  }})(s,'');
  return out.filter(x=>x.t);
}

function nextSteps(s){
  const steps=[];
  const hasPersona=has(s.personas);
  const hasPOV=has(s.define);
  const mx=s.ideate&&s.ideate.matrix;const hasMatrix=mx&&has(mx.items||Object.values(mx).find(v=>Array.isArray(v)));
  const hasProto=has(s.prototype)||B('mvp')(s);
  const hasResearch=has(s.researchPlan&&s.researchPlan.hypotheses);
  const hasVC=has(s.valueCanvas);
  if(!hasPersona) steps.push({t:'建立用户画像',d:'用 AI 生成第一个画像，作为后续所有工具的基础',f:'persona.html',ok:false});
  if(hasPersona&&!hasPOV) steps.push({t:'写出 POV 洞察句',d:'把访谈/观察收敛成清晰的问题陈述',f:'pov.html',ok:false});
  if(hasPOV&&!hasMatrix) steps.push({t:'用丘吉尔矩阵筛选方案',d:'选出最值得原型化的方向',f:'matrix.html',ok:false});
  if(hasMatrix&&!hasVC) steps.push({t:'检验价值主张画布',d:'验证方案是否真正对准用户痛点',f:'value-canvas.html',ok:false});
  if(hasMatrix&&!hasProto) steps.push({t:'制作 MVP 画布',d:'定义最小实验与成功标准',f:'board-mvp.html',ok:false});
  if(hasProto&&!hasResearch) steps.push({t:'制定用户研究计划',d:'在真实用户面前测试前，整理假设与访谈提纲',f:'research-plan.html',ok:false});
  if(!steps.length) steps.push({t:'继续迭代',d:'所有核心工具已有内容，查看工具总览或修改任意页面',f:'overview.html',ok:true});
  return steps.slice(0,3);
}

  }
  return `请用设计思维 Skill 为当前项目生成「${tool[1]}」。\n项目：${pname}\n输出文件：${tool[2]}\n\n请根据项目背景生成完整数据，并输出 project.json 更新片段。`;
}

  const hero=h('div',{class:'db-hero'});
  const hl=h('div');
  const pname=s.meta&&(s.meta.name||s.meta.project)||'未命名项目';
  hl.appendChild(h('div',{class:'db-hero-title'},pname+'<small>'+(s.meta&&s.meta.challenge||'点击「编辑」填写设计挑战')+'</small>'));
  // 进度条
  const prog=h('div',{class:'db-progress'});
  PH.forEach(p=>{
    const ts=TOOLS.filter(t=>t[0]===p.k),done=ts.filter(t=>t[3](s)).length;
    const pd=h('div',{class:'db-ph'+(s.meta.phase===p.k?' cur':''),style:'--c:'+p.c});
    pd.innerHTML=`<div class="db-ph-name">${p.n}</div><div class="db-ph-bar"><i style="width:${ts.length?done/ts.length*100:0}%"></i></div><div class="db-ph-cnt">${done}/${ts.length}</div>`;
    prog.appendChild(pd);
  });
  hl.appendChild(prog);
  hero.appendChild(hl);
  const hr=h('div',{class:'db-hero-actions'});
  const editBtn=h('button',{},'编辑项目信息');
  editBtn.onclick=()=>window.open('overview.html','_self');
  hr.appendChild(editBtn);
  const impBtn=h('button',{},'导入 JSON');
  impBtn.onclick=()=>document.getElementById('dt-modal').classList.add('open');
  hr.appendChild(impBtn);
  hero.appendChild(hr);
  app.appendChild(hero);

  // ── 摘要数字 ──
  const totalT=TOOLS.length,doneT=TOOLS.filter(t=>t[3](s)).length;
  const coreT=TOOLS.filter(t=>t[4]===1),coreDoneT=coreT.filter(t=>t[3](s)).length;
  const vl=collectVerify(s);
  const checked=(s.meta._vchecked||[]);
  const pendV=vl.filter(x=>!checked.includes(x.t)).length;
  const stat=h('div',{class:'db-stats'});
  [[doneT+' / '+totalT,'工具已填写','var(--blue)'],[coreDoneT+' / '+coreT.length,'核心工具','var(--green)'],[pendV,'待验证项','var(--orange)'],[(PH.find(p=>p.k===s.meta.phase)||PH[0]).n,'当前阶段','var(--purple)']].forEach(([v,l,c])=>{
    const cell=h('div',{class:'db-stat'});
    cell.appendChild(h('div',{class:'v',style:'color:'+c},String(v)));
    cell.appendChild(h('div',{class:'l'},l));
    stat.appendChild(cell);
  });
  app.appendChild(stat);

  // ── 下一步建议 ──
  const nexts=nextSteps(s);
  const nb=h('div',{class:'db-next'});
  nb.appendChild(h('h3',{},'💡 下一步建议'));
  const ni=h('div',{class:'db-next-items'});
  nexts.forEach((n,i)=>{
    const row=h('div',{class:'db-next-item'});
    row.appendChild(h('div',{class:'db-next-num'},String(i+1)));
    const nc=h('div',{class:'db-next-txt'});
    nc.appendChild(h('div',{class:'t'},n.t));
    nc.appendChild(h('div',{class:'d'},n.d));
    row.appendChild(nc);
    const na=h('div',{class:'db-next-actions'});
    if(!n.ok){
      const tool=TOOLS.find(t=>t[2]===n.f);
      if(tool){
        const cp=h('button',{},'复制生成指令');
        cp.onclick=()=>{const p=genPrompt(tool);navigator.clipboard&&navigator.clipboard.writeText(p).then(()=>DT.toast('已复制，粘贴给 AI 即可'));};
        na.appendChild(cp);
      }
    }
    const link=h('a',{href:n.f},n.ok?'查看':'打开');
    na.appendChild(link);
    row.appendChild(na);
    ni.appendChild(row);
  });
  nb.appendChild(ni);
  app.appendChild(nb);

  // ── 各阶段工具卡片 ──
  app.appendChild(h('h3',{class:'sec'},'所有工具'));
  PH.forEach(p=>{
    const ts=TOOLS.filter(t=>t[0]===p.k);
    const done=ts.filter(t=>t[3](s)).length;
    const sec=h('div',{class:'db-phase-sec'});
    const hd=h('div',{class:'db-phase-hd',style:'--c:'+p.c});
    hd.appendChild(h('h3',{},p.n+' · '+p.en));
    hd.appendChild(h('span',{class:'ph-prog'},done+' / '+ts.length+' 已完成'));
    sec.appendChild(hd);
    const grid=h('div',{class:'db-tools'});
    ts.forEach(tool=>{
      const ok=tool[3](s);
      const card=h('div',{class:'db-tool'+(ok?' has-data':''),style:'--c:'+p.c});
      const thd=h('div',{class:'db-tool-hd'});
      thd.appendChild(h('span',{class:'db-tool-name'},tool[1]+(tool[4]===2?' ·':'')));
      thd.appendChild(h('span',{class:'db-tool-badge'},ok?'有内容':'未开始'));
      card.appendChild(thd);
      const prev=h('div',{class:'db-tool-preview'});
      prev.innerHTML=tool[5](s);
      card.appendChild(prev);
      const acts=h('div',{class:'db-tool-actions'});
      if(ok) acts.appendChild(h('a',{href:tool[2]},'打开 →'));
      const cp=h('button',{},ok?'继续优化':'复制生成指令');
      cp.onclick=()=>{
        const p=genPrompt(tool);
        navigator.clipboard&&navigator.clipboard.writeText(p).then(()=>DT.toast('已复制，粘贴给 AI'));
        // 展开 AI 面板
        const panel=document.getElementById('db-ai-panel');
        if(panel){panel.classList.add('open');document.getElementById('db-ai-prompt').textContent=p;}
      };
      acts.appendChild(cp);
      card.appendChild(acts);
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    app.appendChild(sec);
  });

  // ── 待验证清单 ──
  if(vl.length){
    app.appendChild(h('h3',{class:'sec'},'⚠️ 待真人验证（'+vl.length+' 条）'));
    app.appendChild(h('p',{class:'secsub'},'以下来自各工具的 AI 假设，务必通过真实用户验证。勾选表示已验证。'));
    const vbox=h('div',{class:'db-verify'});
    vl.forEach(item=>{
      const isChecked=checked.includes(item.t);
      const row=h('div',{class:'db-verify-item'+(isChecked?' checked':'')});
      const cb=h('input',{type:'checkbox','aria-label':'标记为已验证'});cb.checked=isChecked;
      cb.onchange=()=>{
        const vc=s.meta._vchecked=s.meta._vchecked||[];
        if(cb.checked&&!vc.includes(item.t)) vc.push(item.t);
        else{const i=vc.indexOf(item.t);if(i>=0)vc.splice(i,1);}
        save();render();
      };
      row.appendChild(cb);
      row.appendChild(h('span',{style:'flex:1'},item.t));
      row.appendChild(h('span',{class:'db-verify-src'},item.src));
      vbox.appendChild(row);
    });
    app.appendChild(vbox);
  }

  // ── AI 工作流面板（可折叠） ──
  const aip=h('div',{class:'db-aipanel'+(aiOpen?' open':''),id:'db-ai-panel'});
  const aiphd=h('div',{class:'db-aipanel-hd'});
  aiphd.appendChild(h('h3',{},'🤖 AI 工作流 · Prompt 预览'));
  aiphd.appendChild(h('span',{class:'db-aipanel-toggle'},'▾'));
  aiphd.onclick=()=>{aip.classList.toggle('open');aiOpen=aip.classList.contains('open')};
  aip.appendChild(aiphd);
  const aibody=h('div',{class:'db-aipanel-body'});
  aibody.appendChild(h('p',{style:'font-size:13px;color:var(--muted);margin:0 0 8px'},'点击任意工具卡片的「复制生成指令」后，prompt 会出现在这里。粘贴到 Claude / GPT / DeepSeek，AI 返回 JSON 后点「导入」更新数据。'));
  const promptPre=h('div',{class:'db-prompt-box',id:'db-ai-prompt'},'（点击工具卡片的「复制生成指令」后，prompt 会出现在这里）');
  aibody.appendChild(promptPre);
  const pa=h('div',{class:'db-prompt-actions'});
  const cpAll=h('button',{class:'primary'},'复制');cpAll.onclick=()=>{const t=document.getElementById('db-ai-prompt').textContent;navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>DT.toast('已复制'))};
  const impAll=h('button',{},'导入 AI 返回的 JSON');impAll.onclick=()=>document.getElementById('dt-modal').classList.add('open');
  pa.append(cpAll,impAll);
  aibody.appendChild(pa);
  aip.appendChild(aibody);
  app.appendChild(aip);
}

function md(){
  const s=DT.st;
  const lines=['# '+(s.meta&&(s.meta.name||s.meta.project)||'项目')+' — 仪表盘',''];
  PH.forEach(p=>{
    lines.push('## '+p.n);
    TOOLS.filter(t=>t[0]===p.k).forEach(t=>lines.push('- ['+(t[3](s)?'x':' ')+'] '+t[1]+' ('+t[2]+') — '+t[5](s).replace(/<[^>]+>/g,'')));
    lines.push('');
  });
  const vl=collectVerify(s);
  if(vl.length){lines.push('## 待验证');vl.forEach(v=>lines.push('- [ ] '+v.t+' ('+v.src+')'));}
  return lines.join('\n');
}

DT.boot({title:'项目仪表盘',en:'Dashboard',subtitle:()=>{
  const s=DT.st;return TOOLS.filter(t=>t[3](s)).length+'/'+TOOLS.length+' 个工具有内容';
},render,md});
})();
</script>
</body>
