<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奔驰法 SCAMPER · 设计思维</title>
<style>
:root{--text:#2C2C2B;--muted:#7D7A75;--bg:#FFFFFF;--soft:#F9F8F7;--surface:#F0EFED;--border:#E6E5E3;
--blue:#2783DE;--blue-s:#E5F2FC;--green:#46A171;--green-s:#E8F1EC;--orange:#D5803B;--orange-s:#FBEBDE;--red:#E56458;--red-s:#FCE9E7;--purple:#9A6BC0;--purple-s:#F3ECF8;--yellow:#C9A227;--yellow-s:#FBF3DB;--teal:#3A9DAE;--teal-s:#E3F3F5;--pink:#C9658F;--pink-s:#FAE8F0}
@media (prefers-color-scheme:dark){:root{--text:#FFFFFF;--muted:rgba(255,255,255,.65);--bg:#191919;--soft:#202020;--surface:#383836;--border:rgba(255,255,255,.2);
--blue:#5E9FE8;--blue-s:rgba(94,159,232,.12);--green:#72BC8F;--green-s:rgba(114,188,143,.12);--orange:#DE9255;--orange-s:rgba(222,146,85,.12);--red:#E97366;--red-s:rgba(233,115,102,.12);--purple:#BF8EDA;--purple-s:rgba(191,142,218,.12);--yellow:#EAC26B;--yellow-s:rgba(234,194,107,.12);--teal:#4FB9C9;--teal-s:rgba(79,185,201,.12);--pink:#DF84A8;--pink-s:rgba(223,132,168,.12)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:24px 32px 48px}
/* 顶部导航栏（所有非仪表盘页面注入） */
#dt-nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:0;background:var(--bg);border-bottom:1px solid var(--border);padding:0 24px;height:40px;font-size:13.5px}
#dt-nav a{color:var(--muted);text-decoration:none;padding:0 10px;height:40px;display:flex;align-items:center;border-bottom:2px solid transparent}
#dt-nav a:hover{color:var(--text);background:var(--soft)}
#dt-nav .dt-nav-home{color:var(--blue);font-weight:600;padding-left:0}
#dt-nav .dt-nav-home:hover{background:var(--blue-s)}
#dt-nav .dt-nav-sep{flex:1}
#dt-nav .dt-nav-proj{font-size:12.5px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body:has(#dt-nav) .wrap{padding-top:16px}
.dt-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.dt-head h1{font-size:24px;margin:0;font-weight:650}
.dt-head h1 small{font-size:14px;color:var(--muted);font-weight:400;margin-left:8px}
.dt-head .sub{font-size:13.5px;color:var(--muted);margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
button:hover{background:var(--soft)}
button:focus-visible,[contenteditable]:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.ghost{border-style:dashed;color:var(--muted);font-size:13px;min-height:32px;padding:4px 10px}
button.icon{border:0;background:transparent;color:var(--muted);width:28px;height:28px;min-height:28px;padding:0;border-radius:6px;font-size:16px;line-height:1}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0}
.seg button[aria-pressed=true]{background:var(--surface);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--orange-s);color:var(--orange);font-weight:550;white-space:nowrap}
button.badge{border:0;min-height:0;cursor:pointer;font:inherit;font-size:12.5px;font-weight:550}button.badge:hover{filter:brightness(.96)}
.badge.ok{background:var(--green-s);color:var(--green)}
.badge.info{background:var(--blue-s);color:var(--blue)}
.badge.mute{background:var(--surface);color:var(--muted)}
.box{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--bg)}
.box.soft{background:var(--soft)}
.sec{font-size:17px;font-weight:650;margin:28px 0 4px}
.secsub{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.hint{font-size:12.5px;color:var(--muted)}
.card{position:relative;background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:8px 32px 8px 10px}
.card>.icon.del{position:absolute;top:4px;right:4px}
.ed{outline:none;min-height:1.4em;word-break:break-word}
.ed:empty:before{content:attr(data-ph);color:var(--muted)}
.ev{font-size:12px;border:0;padding:1px 8px;min-height:22px;border-radius:999px;cursor:pointer}
.ev.quote{background:var(--blue-s);color:var(--blue)}.ev.observed{background:var(--green-s);color:var(--green)}
.ev.inferred{background:var(--purple-s);color:var(--purple)}.ev.assumed{background:var(--orange-s);color:var(--orange)}
input,select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 8px;min-height:36px;max-width:100%}
textarea{resize:vertical}
.core{border-radius:12px;padding:16px 20px;background:var(--blue-s);border-left:4px solid var(--blue)}
.core .lbl{font-size:13px;color:var(--blue);font-weight:650;margin-bottom:4px}
.core .ed{font-size:16px;font-weight:550}
.verify{border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-top:16px}
.verify ul{margin:6px 0 0;padding-left:20px}.verify li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.open{display:flex}
.modal .panel{background:var(--bg);border-radius:12px;padding:20px;width:min(640px,100%);box-shadow:0 4px 24px rgba(0,0,0,.18)}
.modal textarea{width:100%;min-height:220px;font-family:Menlo,Consolas,monospace;font-size:12.5px}
.empty{color:var(--muted);font-size:14px;padding:12px;border:1px dashed var(--border);border-radius:8px;text-align:center}
.foot{margin-top:40px;font-size:12.5px;color:var(--muted);text-align:center}
.foot a{color:var(--muted)}
/* AI 辅助面板（desk research 等页面） */
.aip{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:20px 0 0;background:var(--soft)}
.aip-hd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px}
.aip-btns{display:flex;flex-wrap:wrap;gap:8px}
.aip-rv{border-color:var(--orange);color:var(--orange)}
.aip-box{display:none;margin:10px 0 0;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:13px/1.7 inherit;font-family:inherit;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.aip-box.open{display:block}
.srcs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px}
.src-chip{font-size:11.5px;min-height:22px;padding:0 8px;border-radius:999px;border:0;background:var(--blue-s);color:var(--blue)}
.src-chip.miss{background:var(--red-s);color:var(--red)}
.src-add{font-size:12px;min-height:24px;padding:0 4px;max-width:180px;color:var(--muted)}
@media (max-width:720px){.wrap{padding:16px}.dt-head h1{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.lay{display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:start}
.wheel{width:100%;max-width:380px;aspect-ratio:1}
.wheel .sec-g{cursor:pointer}
.wheel .sec-g:focus{outline:none}
.wheel .sec-g:focus-visible path{stroke:var(--text);stroke-width:3}
.subj{font-size:14px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.subj .ed{font-weight:650;border-bottom:1px dashed var(--border);min-width:120px}
.panel h2{font-size:22px;margin:0;display:flex;gap:10px;align-items:baseline}
.panel h2 .lt{font-size:30px;font-weight:800}
.qs{margin:8px 0 14px;padding-left:20px;color:var(--muted);font-size:14px}
.ideas{display:flex;flex-direction:column;gap:8px}
.idea{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:start;background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:8px 6px 8px 10px}
.idea.on{border-color:var(--yellow);background:var(--yellow-s)}
.star{font-size:17px;color:var(--muted);border:0;background:transparent;width:30px;height:30px;min-height:30px;padding:0}
.star.on{color:var(--yellow)}
.short{margin-top:8px}
.short li{margin:4px 0}
.lt-chip{display:inline-block;min-width:22px;text-align:center;border-radius:6px;font-weight:700;font-size:12px;color:#fff;margin-right:6px;padding:0 4px}
@media (max-width:820px){.lay{grid-template-columns:1fr}.wheel{margin:0 auto;display:block;max-width:320px}}
</style>
</head>
<body data-tpl="scamper">
<div class="wrap">
<header class="dt-head" id="dt-head"></header>
<main id="app"></main>
<div class="foot">设计思维 Skill · 修改会自动保存在本浏览器 · 点「复制给 AI」把结果带回对话</div>
</div>
<script id="dt-data" type="application/json">/*DT_DATA*/</script>
<script>
const DT=(function(){
 const REG={"phases":[{"k":"empathize","n":"共情","en":"Empathize"},{"k":"define","n":"定义视角","en":"Point of View"},{"k":"ideate","n":"构思","en":"Ideate"},{"k":"prototype","n":"原型","en":"Prototype"},{"k":"test","n":"测试","en":"Test"},{"k":"reflect","n":"反思","en":"Reflect"}],"tools":[{"phase":"empathize","name":"用户画像 Persona","file":"persona.html","tpl":"persona","path":["personas","personaSteps"],"check":["personas"],"core":1,"desc":"10 步法 + 画像画布，描述典型用户","when":"有了初步观察/访谈之后"},{"phase":"empathize","name":"移情图 Empathy Map","file":"empathy-map.html","tpl":"empathy-map","path":["empathyMap"],"check":["empathyMap"],"core":1,"desc":"看/听/说/做/想/感 + 痛点与收获","when":"整理访谈与观察记录"},{"phase":"empathize","name":"顾客旅程图","file":"journey.html","tpl":"journey","path":["journey"],"check":["journey.stages"],"core":2,"desc":"分阶段的行为、触点、情绪曲线与机会点","when":"理解完整体验与断点"},{"phase":"empathize","name":"Hook 上瘾模型","file":"hook.html","tpl":"hook","path":["hook"],"check":["hook"],"core":2,"desc":"触发-行动-奖赏-投入，含伦理检查","when":"研究习惯与持续使用"},{"phase":"empathize","name":"AEIOU 观察","file":"board-aeiou.html","tpl":"board","path":["boards.aeiou"],"check":["boards.aeiou.cards"],"core":2,"desc":"按活动/环境/互动/物体/用户结构化记录观察","when":"进入现场观察前与观察中"},{"phase":"empathize","name":"访谈提纲","file":"table-interview.html","tpl":"table","path":["tables.interview"],"check":["tables.interview.rows"],"core":2,"desc":"开放式问题 + 追问“为什么” + 例外","when":"真人访谈前准备"},{"phase":"empathize","name":"AEIOU 问卷","file":"table-survey.html","tpl":"table","path":["tables.survey"],"check":["tables.survey.rows"],"core":2,"desc":"按五维度设计问卷，验证访谈发现有多普遍","when":"访谈之后、需要量化验证时"},{"phase":"empathize","name":"利益相关者地图","file":"radial-stakeholders.html","tpl":"radial","path":["radials.stakeholders"],"check":["radials.stakeholders.items"],"core":2,"desc":"谁使用、谁付钱、谁决定、谁受影响（补充工具）","when":"项目开始、涉及多方时"},{"phase":"empathize","name":"极端 / 未来用户","file":"table-extremes.html","tpl":"table","path":["tables.extremes"],"check":["tables.extremes.rows"],"core":2,"desc":"从极端与领先用户身上发现隐性需求","when":"想突破主流用户的常规答案"},{"phase":"prototype","name":"故事板 Storyboard","file":"storyboard.html","tpl":"storyboard","path":["storyboard"],"check":["storyboard.frames"],"core":2,"desc":"用分镜讲清用户在具体情境中的经历","when":"原型阶段具象化方案使用场景（to-be），向用户展示和收集反馈"},{"phase":"empathize","name":"竞品分析","file":"table-competitors.html","tpl":"table","path":["tables.competitors"],"check":["tables.competitors.rows"],"core":2,"desc":"对比现有方案的优缺点与空白","when":"了解用户当前的替代方案"},{"phase":"empathize","name":"研究问题拆解","file":"research-query.html","tpl":"research-query","path":["deskResearch.query"],"check":["deskResearch.query.question"],"core":2,"desc":"把模糊问题拆成可检索的子问题，生成中英文搜索关键词矩阵","when":"桌面研究开始前，或进入陌生领域时"},{"phase":"empathize","name":"来源管理板","file":"source-board.html","tpl":"source-board","path":["deskResearch.sources"],"check":["deskResearch.sources"],"core":2,"desc":"记录二手资料的 URL、摘要、可信度与相关性，看板式筛选","when":"检索资料过程中，边读边记"},{"phase":"define","name":"JTBD → PoV → HMW","file":"pov.html","tpl":"pov","path":["define"],"check":["define"],"core":1,"desc":"任务、视角陈述与“我们可以如何”问题","when":"形成问题陈述、进入构思前"},{"phase":"define","name":"价值主张画布","file":"value-canvas.html","tpl":"value-canvas","path":["valueCanvas"],"check":["valueCanvas"],"core":2,"desc":"顾客任务/痛点/收益 ↔ 产品/止痛剂/增益","when":"检验方案是否对准真实需求"},{"phase":"define","name":"洞察聚类","file":"board-insights.html","tpl":"board","path":["boards.insights"],"check":["boards.insights.cards"],"core":2,"desc":"把观察卡片聚类、投票选出关键洞察","when":"共情资料较多、需要收敛时"},{"phase":"define","name":"360 度视角","file":"radial-view360.html","tpl":"radial","path":["radials.view360"],"check":["radials.view360.items"],"core":2,"desc":"从多个利益相关方视角审视问题","when":"问题涉及多方角色"},{"phase":"define","name":"九宫格","file":"board-ninegrid.html","tpl":"board","path":["boards.ninegrid"],"check":["boards.ninegrid.cards"],"core":2,"desc":"3×3 结构化拆解问题","when":"问题过于宽泛"},{"phase":"define","name":"雏菊图","file":"radial-daisy.html","tpl":"radial","path":["radials.daisy"],"check":["radials.daisy.items"],"core":2,"desc":"围绕核心问题展开要素花瓣","when":"梳理问题的组成部分"},{"phase":"define","name":"关键假设清单","file":"table-assumptions.html","tpl":"table","path":["tables.assumptions"],"check":["tables.assumptions.rows"],"core":2,"desc":"列出风险最高的假设及验证方式","when":"任何阶段，尤其是测试前"},{"phase":"define","name":"综合矩阵","file":"synthesis.html","tpl":"synthesis","path":["deskResearch.synthesis"],"check":["deskResearch.synthesis.consensus","deskResearch.synthesis.divergence","deskResearch.synthesis.uncertain"],"core":2,"desc":"跨来源对比观点：共识 / 分歧 / 不确定三列，每条关联来源","when":"来源收集到 6 条以上、需要提炼结论时"},{"phase":"define","name":"研究空白","file":"gap-analysis.html","tpl":"gap-analysis","path":["deskResearch.gaps"],"check":["deskResearch.gaps.known","deskResearch.gaps.unknown","deskResearch.gaps.toVerify"],"core":2,"desc":"已知 / 未知 / 需验证三格 + 下一步行动，衔接一手研究","when":"桌面研究收尾、决定还要研究什么时"},{"phase":"define","name":"研究报告","file":"research-report.html","tpl":"research-report","path":["deskResearch.report"],"check":["deskResearch.report.background","deskResearch.report.findings"],"core":2,"desc":"背景 → 发现 → 含义 → 行动建议，一键复制分享","when":"向团队同步桌面研究结论时"},{"phase":"ideate","name":"丘吉尔矩阵","file":"matrix.html","tpl":"matrix","path":["ideate.matrix"],"check":["ideate.matrix.items"],"core":1,"desc":"价值×可行性 或 影响×紧迫 两种维度收敛","when":"点子太多需要排序"},{"phase":"ideate","name":"SCAMPER 奔驰法","file":"scamper.html","tpl":"scamper","path":["ideate.scamper"],"check":["ideate.scamper"],"core":2,"desc":"七个角度改造现有方案","when":"有可改造的现有产品/流程"},{"phase":"ideate","name":"Crazy 8s","file":"board-crazy8.html","tpl":"board","path":["boards.crazy8"],"check":["boards.crazy8.cards"],"core":2,"desc":"8 分钟画 8 个不同方案（补充工具）","when":"需要快速产出多个差异化方案"},{"phase":"ideate","name":"头脑风暴墙","file":"board-brainstorm.html","tpl":"board","path":["boards.brainstorm"],"check":["boards.brainstorm.cards"],"core":2,"desc":"计时发散、贴卡、投票","when":"需要大量点子"},{"phase":"ideate","name":"问题反转","file":"table-reversal.html","tpl":"table","path":["tables.reversal"],"check":["tables.reversal.rows"],"core":2,"desc":"先想“如何让它更糟”，再反转","when":"思路卡住时"},{"phase":"ideate","name":"跨行业对标","file":"table-analogy.html","tpl":"table","path":["tables.analogy"],"check":["tables.analogy.rows"],"core":2,"desc":"借鉴其他行业如何解决类似问题","when":"想要突破行业惯性"},{"phase":"ideate","name":"点子沟通表","file":"table-ideas.html","tpl":"table","path":["tables.ideas"],"check":["tables.ideas.rows"],"core":2,"desc":"把点子讲清楚：名称、用户、价值、风险","when":"向团队/用户展示点子"},{"phase":"prototype","name":"盒子原则 + 保真度","file":"box.html","tpl":"box","path":["prototype"],"check":["prototype"],"core":1,"desc":"把方案做成一个“产品包装盒”，选择原型类型与保真度","when":"把点子变得有形"},{"phase":"prototype","name":"架子原则","file":"board-shelf.html","tpl":"board","path":["boards.shelf"],"check":["boards.shelf.cards"],"core":2,"desc":"把产品/服务/方案摆上不同货架，找空白与协同","when":"有多个方案或产品组合"},{"phase":"prototype","name":"原型工作坊","file":"board-workshop.html","tpl":"board","path":["boards.workshop"],"check":["boards.workshop.cards"],"core":2,"desc":"定义功能→变体→制作→红绿反馈→改进","when":"团队集体快速做原型"},{"phase":"prototype","name":"MVP 画布","file":"board-mvp.html","tpl":"board","path":["boards.mvp"],"check":["boards.mvp.cards"],"core":2,"desc":"用最小实验验证最关键假设（补充工具）","when":"准备上线验证前"},{"phase":"prototype","name":"服务蓝图","file":"table-blueprint.html","tpl":"table","path":["tables.blueprint"],"check":["tables.blueprint.rows"],"core":2,"desc":"前台/后台/支持流程逐步拆解","when":"服务类方案原型"},{"phase":"empathize","name":"用户研究计划","file":"research-plan.html","tpl":"research-plan","path":["researchPlan"],"check":["researchPlan.hypotheses"],"core":2,"desc":"假设清单、招募方案、访谈提纲、分析框架与进度追踪","when":"每轮测试前整理假设与访谈脚本"},{"phase":"test","name":"A/B 测试","file":"ab-test.html","tpl":"ab-test","path":["test.ab"],"check":["test.ab.a"],"core":2,"desc":"两版本对比，浏览器内计算显著性","when":"有可量化指标、样本足够时"},{"phase":"test","name":"测试计划","file":"table-testplan.html","tpl":"table","path":["tables.testplan"],"check":["tables.testplan.rows"],"core":2,"desc":"目标、场景、问题地图、角色分工","when":"每轮测试前"},{"phase":"test","name":"反馈收集表","file":"board-feedback.html","tpl":"board","path":["boards.feedback"],"check":["boards.feedback.cards"],"core":2,
