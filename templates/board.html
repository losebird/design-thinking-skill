<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看板 · 设计思维</title>
<style>
:root{--text:#2C2C2B;--muted:#7D7A75;--bg:#FFFFFF;--soft:#F9F8F7;--surface:#F0EFED;--border:#E6E5E3;
--blue:#2783DE;--blue-s:#E5F2FC;--green:#46A171;--green-s:#E8F1EC;--orange:#D5803B;--orange-s:#FBEBDE;--red:#E56458;--red-s:#FCE9E7;--purple:#9A6BC0;--purple-s:#F3ECF8;--yellow:#C9A227;--yellow-s:#FBF3DB;--teal:#3A9DAE;--teal-s:#E3F3F5;--pink:#C9658F;--pink-s:#FAE8F0}
@media (prefers-color-scheme:dark){:root{--text:#FFFFFF;--muted:rgba(255,255,255,.65);--bg:#191919;--soft:#202020;--surface:#383836;--border:rgba(255,255,255,.2);
--blue:#5E9FE8;--blue-s:rgba(94,159,232,.12);--green:#72BC8F;--green-s:rgba(114,188,143,.12);--orange:#DE9255;--orange-s:rgba(222,146,85,.12);--red:#E97366;--red-s:rgba(233,115,102,.12);--purple:#BF8EDA;--purple-s:rgba(191,142,218,.12);--yellow:#EAC26B;--yellow-s:rgba(234,194,107,.12);--teal:#4FB9C9;--teal-s:rgba(79,185,201,.12);--pink:#DF84A8;--pink-s:rgba(223,132,168,.12)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:24px 32px 48px}
/* 顶部导航栏（所有非仪表盘页面注入） */
#dt-nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:0;background:var(--bg);border-bottom:1px solid var(--border);padding:0 24px;height:40px;font-size:13.5px}
#dt-nav a{color:var(--muted);text-decoration:none;padding:0 10px;height:40px;display:flex;align-items:center;border-bottom:2px solid transparent}
#dt-nav a:hover{color:var(--text);background:var(--soft)}
#dt-nav .dt-nav-home{color:var(--blue);font-weight:600;padding-left:0}
#dt-nav .dt-nav-home:hover{background:var(--blue-s)}
#dt-nav .dt-nav-sep{flex:1}
#dt-nav .dt-nav-proj{font-size:12.5px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body:has(#dt-nav) .wrap{padding-top:16px}
.dt-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.dt-head h1{font-size:24px;margin:0;font-weight:650}
.dt-head h1 small{font-size:14px;color:var(--muted);font-weight:400;margin-left:8px}
.dt-head .sub{font-size:13.5px;color:var(--muted);margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
button:hover{background:var(--soft)}
button:focus-visible,[contenteditable]:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.ghost{border-style:dashed;color:var(--muted);font-size:13px;min-height:32px;padding:4px 10px}
button.icon{border:0;background:transparent;color:var(--muted);width:28px;height:28px;min-height:28px;padding:0;border-radius:6px;font-size:16px;line-height:1}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0}
.seg button[aria-pressed=true]{background:var(--surface);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--orange-s);color:var(--orange);font-weight:550;white-space:nowrap}
button.badge{border:0;min-height:0;cursor:pointer;font:inherit;font-size:12.5px;font-weight:550}button.badge:hover{filter:brightness(.96)}
.badge.ok{background:var(--green-s);color:var(--green)}
.badge.info{background:var(--blue-s);color:var(--blue)}
.badge.mute{background:var(--surface);color:var(--muted)}
.box{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--bg)}
.box.soft{background:var(--soft)}
.sec{font-size:17px;font-weight:650;margin:28px 0 4px}
.secsub{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.hint{font-size:12.5px;color:var(--muted)}
.card{position:relative;background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:8px 32px 8px 10px}
.card>.icon.del{position:absolute;top:4px;right:4px}
.ed{outline:none;min-height:1.4em;word-break:break-word}
.ed:empty:before{content:attr(data-ph);color:var(--muted)}
.ev{font-size:12px;border:0;padding:1px 8px;min-height:22px;border-radius:999px;cursor:pointer}
.ev.quote{background:var(--blue-s);color:var(--blue)}.ev.observed{background:var(--green-s);color:var(--green)}
.ev.inferred{background:var(--purple-s);color:var(--purple)}.ev.assumed{background:var(--orange-s);color:var(--orange)}
input,select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 8px;min-height:36px;max-width:100%}
textarea{resize:vertical}
.core{border-radius:12px;padding:16px 20px;background:var(--blue-s);border-left:4px solid var(--blue)}
.core .lbl{font-size:13px;color:var(--blue);font-weight:650;margin-bottom:4px}
.core .ed{font-size:16px;font-weight:550}
.verify{border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-top:16px}
.verify ul{margin:6px 0 0;padding-left:20px}.verify li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.open{display:flex}
.modal .panel{background:var(--bg);border-radius:12px;padding:20px;width:min(640px,100%);box-shadow:0 4px 24px rgba(0,0,0,.18)}
.modal textarea{width:100%;min-height:220px;font-family:Menlo,Consolas,monospace;font-size:12.5px}
.empty{color:var(--muted);font-size:14px;padding:12px;border:1px dashed var(--border);border-radius:8px;text-align:center}
.foot{margin-top:40px;font-size:12.5px;color:var(--muted);text-align:center}
.foot a{color:var(--muted)}
/* AI 辅助面板（desk research 等页面） */
.aip{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:20px 0 0;background:var(--soft)}
.aip-hd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px}
.aip-btns{display:flex;flex-wrap:wrap;gap:8px}
.aip-rv{border-color:var(--orange);color:var(--orange)}
.aip-box{display:none;margin:10px 0 0;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:13px/1.7 inherit;font-family:inherit;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.aip-box.open{display:block}
.srcs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px}
.src-chip{font-size:11.5px;min-height:22px;padding:0 8px;border-radius:999px;border:0;background:var(--blue-s);color:var(--blue)}
.src-chip.miss{background:var(--red-s);color:var(--red)}
.src-add{font-size:12px;min-height:24px;padding:0 4px;max-width:180px;color:var(--muted)}
@media (max-width:720px){.wrap{padding:16px}.dt-head h1{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.intro{font-size:14px;color:var(--muted);margin:0 0 12px}
.stepper{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.stp{font-size:13px;border-radius:999px;padding:4px 12px;min-height:32px}
.stp.done{background:var(--green-s);color:var(--green);border-color:transparent}
.stp.cur{background:var(--text);color:var(--bg);border-color:var(--text)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px;font-size:13.5px}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--blue);display:inline-block}
.dots i.used{background:var(--surface)}
.timer{font-family:Menlo,Consolas,monospace;font-size:18px;font-weight:700}
.timer.end{color:var(--red)}
.bd{display:grid;gap:12px}
.col{border-radius:12px;padding:12px;min-height:160px;display:flex;flex-direction:column;border:1px solid var(--border);border-top-width:4px;background:var(--bg)}
.col.over{outline:2px dashed var(--blue);outline-offset:-4px}
.col h2{font-size:15px;margin:0}
.col .hint{margin:2px 0 10px}
.col .cards{display:flex;flex-direction:column;gap:8px;flex:1}
.col>.ghost{margin-top:8px;align-self:flex-start}
.bc{background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:grab}
.bc.top{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-s)}
.bc .ft{display:flex;align-items:center;gap:4px;margin-top:6px}
.bc .ft .sp{flex:1}
.vb{font-size:12.5px;min-height:26px;padding:0 8px;border-radius:999px}
.vb b{color:var(--blue)}
.bc .icon{width:26px;height:26px;min-height:26px;font-size:14px}
.acts .ar{display:grid;grid-template-columns:auto 1fr 130px 150px auto;gap:8px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin-bottom:6px}
.acts .ar.done .ed{text-decoration:line-through;color:var(--muted)}
.acts input[type=checkbox]{width:20px;height:20px;min-height:auto}
.acts input[type=date]{min-height:32px;padding:2px 6px}
.acts .own{border:1px solid var(--border);border-radius:8px;padding:4px 8px}
@media (max-width:820px){.bd{grid-template-columns:1fr 1fr!important}.acts .ar{grid-template-columns:auto 1fr auto}.acts .own,.acts input[type=date]{grid-column:2}}
@media (max-width:520px){.bd{grid-template-columns:1fr!important}}
</style>
</head>
<body data-tpl="board">
<div class="wrap">
<header class="dt-head" id="dt-head"></header>
<main id="app"></main>
<div class="foot">设计思维 Skill · 修改会自动保存在本浏览器 · 点「复制给 AI」把结果带回对话</div>
</div>
<script id="dt-data" type="application/json">/*DT_DATA*/</script>
<script>
const DT=(function(){
 const REG={"phases":[{"k":"empathize","n":"共情","en":"Empathize"},{"k":"define","n":"定义视角","en":"Point of View"},{"k":"ideate","n":"构思","en":"Ideate"},{"k":"prototype","n":"原型","en":"Prototype"},{"k":"test","n":"测试","en":"Test"},{"k":"reflect","n":"反思","en":"Reflect"}],"tools":[{"phase":"empathize","name":"用户画像 Persona","file":"persona.html","tpl":"persona","path":["personas","personaSteps"],"check":["personas","persona"],"core":1,"desc":"10 步法 + 画像画布，描述典型用户","when":"有了初步观察/访谈之后"},{"phase":"empathize","name":"移情图 Empathy Map","file":"empathy-map.html","tpl":"empathy-map","path":["empathyMap"],"check":["empathyMap"],"core":1,"desc":"看/听/说/做/想/感 + 痛点与收获","when":"整理访谈与观察记录"},{"phase":"empathize","name":"顾客旅程图","file":"journey.html","tpl":"journey","path":["journey"],"check":["journey.stages"],"core":1,"desc":"分阶段的行为、触点、情绪曲线与机会点","when":"理解完整体验与断点"},{"phase":"empathize","name":"Hook 上瘾模型","file":"hook.html","tpl":"hook","path":["hook"],"check":["hook"],"core":1,"desc":"触发-行动-奖赏-投入，含伦理检查","when":"研究习惯与持续使用"},{"phase":"empathize","name":"AEIOU 观察","file":"board-aeiou.html","tpl":"board","path":["boards.aeiou"],"check":["boards.aeiou.cards"],"core":2,"desc":"按活动/环境/互动/物体/用户结构化记录观察","when":"进入现场观察前与观察中"},{"phase":"empathize","name":"访谈提纲","file":"table-interview.html","tpl":"table","path":["tables.interview"],"check":["tables.interview.rows","tables.interview.questions","tables.interview.items"],"core":2,"desc":"开放式问题 + 追问“为什么” + 例外","when":"真人访谈前准备"},{"phase":"empathize","name":"AEIOU 问卷","file":"table-survey.html","tpl":"table","path":["tables.survey"],"check":["tables.survey.rows","tables.survey.questions","tables.survey.items"],"core":2,"desc":"按五维度设计问卷，验证访谈发现有多普遍","when":"访谈之后、需要量化验证时"},{"phase":"empathize","name":"利益相关者地图","file":"radial-stakeholders.html","tpl":"radial","path":["radials.stakeholders"],"check":["radials.stakeholders.items","radials.stakeholders.petals"],"core":2,"desc":"谁使用、谁付钱、谁决定、谁受影响（补充工具）","when":"项目开始、涉及多方时"},{"phase":"empathize","name":"极端 / 未来用户","file":"table-extremes.html","tpl":"table","path":["tables.extremes"],"check":["tables.extremes.rows","tables.extremes.questions","tables.extremes.items"],"core":2,"desc":"从极端与领先用户身上发现隐性需求","when":"想突破主流用户的常规答案"},{"phase":"empathize","name":"故事板 Storyboard","file":"storyboard.html","tpl":"storyboard","path":["storyboard"],"check":["storyboard.frames"],"core":2,"desc":"用分镜讲清用户在具体情境中的经历","when":"理解场景，或在原型阶段讲述新方案"},{"phase":"empathize","name":"竞品分析","file":"table-competitors.html","tpl":"table","path":["tables.competitors"],"check":["tables.competitors.rows","tables.competitors.questions","tables.competitors.items"],"core":2,"desc":"对比现有方案的优缺点与空白","when":"了解用户当前的替代方案"},{"phase":"empathize","name":"研究问题拆解","file":"research-query.html","tpl":"research-query","path":["deskResearch.query"],"check":["deskResearch.query.question"],"core":2,"desc":"把模糊问题拆成可检索的子问题，生成中英文搜索关键词矩阵","when":"桌面研究开始前，或进入陌生领域时"},{"phase":"empathize","name":"来源管理板","file":"source-board.html","tpl":"source-board","path":["deskResearch.sources"],"check":["deskResearch.sources"],"core":2,"desc":"记录二手资料的 URL、摘要、可信度与相关性，看板式筛选","when":"检索资料过程中，边读边记"},{"phase":"define","name":"JTBD → PoV → HMW","file":"pov.html","tpl":"pov","path":["define"],"check":["define"],"core":1,"desc":"任务、视角陈述与“我们可以如何”问题","when":"形成问题陈述、进入构思前"},{"phase":"define","name":"价值主张画布","file":"value-canvas.html","tpl":"value-canvas","path":["valueCanvas"],"check":["valueCanvas"],"core":1,"desc":"顾客任务/痛点/收益 ↔ 产品/止痛剂/增益","when":"检验方案是否对准真实需求"},{"phase":"define","name":"洞察聚类","file":"board-insights.html","tpl":"board","path":["boards.insights"],"check":["boards.insights.cards"],"core":2,"desc":"把观察卡片聚类、投票选出关键洞察","when":"共情资料较多、需要收敛时"},{"phase":"define","name":"360 度视角","file":"radial-view360.html","tpl":"radial","path":["radials.view360"],"check":["radials.view360.items","radials.view360.petals"],"core":2,"desc":"从多个利益相关方视角审视问题","when":"问题涉及多方角色"},{"phase":"define","name":"九宫格","file":"board-ninegrid.html","tpl":"board","path":["boards.ninegr (function(){
const {h,esc,save,ed}=DT;
const COL={blue:'var(--blue)',green:'var(--green)',orange:'var(--orange)',red:'var(--red)',purple:'var(--purple)',yellow:'var(--yellow)',teal:'var(--teal)',pink:'var(--pink)',gray:'var(--muted)'};
const BG={blue:'var(--blue-s)',green:'var(--green-s)',orange:'var(--orange-s)',red:'var(--red-s)',purple:'var(--purple-s)',yellow:'var(--yellow-s)',teal:'var(--teal-s)',pink:'var(--pink-s)',gray:'var(--soft)'};
const B=()=>{const b=DT.get(DT.target||'boards.board',{});b.columns=b.columns||[{key:'a',title:'第一列'},{key:'b',title:'第二列'}];b.cards=b.cards||{};const AL={hypo:['hypothesis']};b.columns.forEach(c=>{b.cards[c.key]=b.cards[c.key]||[];if(!b.cards[c.key].length){[c.key].concat(AL[c.key]||[]).forEach(f=>{const v=b[f];if(v==null||typeof v==='object'&&!Array.isArray(v))return;(Array.isArray(v)?v:[v]).forEach(x=>{const t=typeof x==='string'?x:(x&&x.text)||'';if(t)b.cards[c.key].push({id:DT.nid(c.key.slice(0,2)),text:t})});delete b[f]})}});return b};
let tmr=null,left=null,drag=null;
function myUsed(b){return Object.values(b.myVotes||{}).reduce((a,n)=>a+n,0)}
function render(){const app=document.getElementById('app');app.innerHTML='';const b=B();
 if(b.intro)app.appendChild(h('p',{class:'intro'},esc(b.intro)));
 if(b.steps&&b.steps.length){b.step=b.step||0;const sp=h('div',{class:'stepper'});b.steps.forEach((s,i)=>{const x=h('button',{class:'stp'+(i<b.step?' done':i===b.step?' cur':''),'aria-current':i===b.step?'step':'false'},(i+1)+'. '+esc(s));x.onclick=()=>{b.step=i;save();render()};sp.appendChild(x)});app.appendChild(sp)}
 const bar=h('div',{class:'bar'});
 if(b.voting&&b.voting.enabled){const per=b.voting.perPerson||3,used=myUsed(b);bar.appendChild(h('span',{},'我的投票点：<span class="dots">'+Array.from({length:per},(_,i)=>'<i class="'+(i<used?'used':'')+'"></i>').join('')+'</span> 剩 '+(per-used)+' / '+per));
  const rv=h('button',{},'收回我的投票');rv.onclick=()=>{const mv=b.myVotes||{};Object.keys(mv).forEach(id=>{for(const k in b.cards){const c=b.cards[k].find(x=>x.id===id);if(c)c.votes=Math.max(0,(c.votes||0)-mv[id])}});b.myVotes={};save();render()};bar.appendChild(rv)}
 if(b.timer&&b.timer.minutes){const tv=h('span',{class:'timer',id:'tm'},fmt(left==null?b.timer.minutes*60:left));const tb=h('button',{},tmr?'暂停':'开始计时 '+b.timer.minutes+' 分钟');tb.onclick=()=>{if(tmr){clearInterval(tmr);tmr=null;render();return}if(left==null||left<=0)left=b.timer.minutes*60;tmr=setInterval(()=>{left--;const e=document.getElementById('tm');if(e){e.textContent=fmt(left);if(left<=0){e.classList.add('end');clearInterval(tmr);tmr=null;DT.toast('时间到！');render()}}},1000);render()};bar.append(tv,tb)}
 if(bar.children.length)app.appendChild(bar);
 const tops=new Set();if(b.voting&&b.voting.enabled){const all=b.columns.flatMap(c=>b.cards[c.key]).filter(c=>c.votes>0).sort((x,y)=>y.votes-x.votes);all.slice(0,3).forEach(c=>tops.add(c.id))}
 const bd=h('div',{class:'bd'});bd.style.gridTemplateColumns='repeat('+(b.cols||Math.min(b.columns.length,4))+',minmax(0,1fr))';
 b.columns.forEach((c,ci)=>{const col=h('section',{class:'col','aria-label':c.title});col.style.borderTopColor=COL[c.color]||'var(--border)';if(c.tint)col.style.background=BG[c.color]||'';
  col.appendChild(h('h2',{},esc(c.title)));if(c.hint)col.appendChild(h('div',{class:'hint'},esc(c.hint)));
  const cs=h('div',{class:'cards'});const arr=b.cards[c.key];
  arr.forEach((it,i)=>{const cd=h('div',{class:'bc'+(tops.has(it.id)?' top':''),draggable:'true'});cd.appendChild(ed(h('div'),it,'text','写一张便利贴……'));
   cd.addEventListener('dragstart',e=>{drag={k:c.key,i};e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',it.id)}catch(_){}});
   const ft=h('div',{class:'ft'});
   if(b.voting&&b.voting.enabled){const v=h('button',{class:'vb','aria-label':'投一票'},'● <b>'+(it.votes||0)+'</b>');v.onclick=()=>{const per=b.voting.perPerson||3;if(myUsed(b)>=per){DT.toast('投票点已用完');return}b.myVotes=b.myVotes||{};b.myVotes[it.id]=(b.myVotes[it.id]||0)+1;it.votes=(it.votes||0)+1;save();render()};ft.appendChild(v)}
   ft.appendChild(h('span',{class:'sp'}));
   const l=h('button',{class:'icon','aria-label':'移到左一列',title:'移到左一列'},'‹'),r=h('button',{class:'icon','aria-label':'移到右一列',title:'移到右一列'},'›');
   l.onclick=()=>move(c.key,i,b.columns[ci-1]);r.onclick=()=>move(c.key,i,b.columns[ci+1]);if(ci===0)l.disabled=true;if(ci===b.columns.length-1)r.disabled=true;
   const x=h('button',{class:'icon','aria-label':'删除'},'×');x.onclick=()=>{arr.splice(i,1);save();render()};ft.append(l,r,x);cd.appendChild(ft);cs.appendChild(cd)});
  col.appendChild(cs);const a=h('button',{class:'ghost'},'+ 添加');a.onclick=()=>{arr.push({id:DT.nid(c.key.slice(0,2)),text:''});save();render();const e=col.querySelectorAll('.bc .ed');const cols=document.querySelectorAll('.col');const ee=cols[ci].querySelectorAll('.bc .ed');ee.length&&ee[ee.length-1].focus()};col.appendChild(a);
  col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});col.addEventListener('dragleave',()=>col.classList.remove('over'));
  col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');if(drag&&drag.k!==c.key)move(drag.k,drag.i,c);drag=null});
  bd.appendChild(col)});
 app.appendChild(bd);
 if(b.actionsEnabled){b.actions=b.actions||[];app.appendChild(h('h3',{class:'sec'},'下一步行动'));app.appendChild(h('p',{class:'secsub'},'每个行动项都要有负责人（跟进者）和预期完成时间。'));
  const ac=h('div',{class:'acts'});b.actions.forEach((it,i)=>{const r=h('div',{class:'ar'+(it.done?' done':'')});const cb=h('input',{type:'checkbox','aria-label':'完成'});cb.checked=!!it.done;cb.onchange=()=>{it.done=cb.checked;save();render()};
   r.appendChild(cb);r.appendChild(ed(h('div'),it,'text','具体、可执行的改进'));r.appendChild(ed(h('div',{class:'own'}),it,'owner','负责人'));
   const dt=h('input',{type:'date','aria-label':'截止日期'});dt.value=it.due||'';dt.onchange=()=>{it.due=dt.value;save()};r.appendChild(dt);
   const x=h('button',{class:'icon','aria-label':'删除'},'×');x.onclick=()=>{b.actions.splice(i,1);save();render()};r.appendChild(x);ac.appendChild(r)});
  const aa=h('button',{class:'ghost'},'+ 行动项');aa.onclick=()=>{b.actions.push({id:DT.nid('a'),text:'',owner:'',due:''});save();render()};ac.appendChild(aa);app.appendChild(ac)}}
function move(k,i,to){if(!to)return;const b=B();const [it]=b.cards[k].splice(i,1);b.cards[to.key].push(it);save();render()}
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function md(){const b=B();const L=['# '+(b.title||'看板'),''];b.columns.forEach(c=>{L.push('## '+c.title);b.cards[c.key].forEach(x=>L.push('- '+x.text+(x.votes?'（'+x.votes+' 票）':'')));L.push('')});
 if(b.actionsEnabled&&(b.actions||[]).length){L.push('## 下一步行动');b.actions.forEach(a=>L.push('- ['+(a.done?'x':' ')+'] '+a.text+(a.owner?' · 负责人：'+a.owner:'')+(a.due?' · 截止：'+a.due:'')))}return L.join('\n')}
DT.boot({title:B().title||'看板',en:B().en||'',render,md});
})();
