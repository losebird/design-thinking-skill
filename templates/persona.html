<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户画像 · 设计思维</title>
<style>
:root{--text:#2C2C2B;--muted:#7D7A75;--bg:#FFFFFF;--soft:#F9F8F7;--surface:#F0EFED;--border:#E6E5E3;
--blue:#2783DE;--blue-s:#E5F2FC;--green:#46A171;--green-s:#E8F1EC;--orange:#D5803B;--orange-s:#FBEBDE;--red:#E56458;--red-s:#FCE9E7;--purple:#9A6BC0;--purple-s:#F3ECF8;--yellow:#C9A227;--yellow-s:#FBF3DB;--teal:#3A9DAE;--teal-s:#E3F3F5;--pink:#C9658F;--pink-s:#FAE8F0}
@media (prefers-color-scheme:dark){:root{--text:#FFFFFF;--muted:rgba(255,255,255,.65);--bg:#191919;--soft:#202020;--surface:#383836;--border:rgba(255,255,255,.2);
--blue:#5E9FE8;--blue-s:rgba(94,159,232,.12);--green:#72BC8F;--green-s:rgba(114,188,143,.12);--orange:#DE9255;--orange-s:rgba(222,146,85,.12);--red:#E97366;--red-s:rgba(233,115,102,.12);--purple:#BF8EDA;--purple-s:rgba(191,142,218,.12);--yellow:#EAC26B;--yellow-s:rgba(234,194,107,.12);--teal:#4FB9C9;--teal-s:rgba(79,185,201,.12);--pink:#DF84A8;--pink-s:rgba(223,132,168,.12)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:24px 32px 48px}
/* 顶部导航栏（所有非仪表盘页面注入） */
#dt-nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:0;background:var(--bg);border-bottom:1px solid var(--border);padding:0 24px;height:40px;font-size:13.5px}
#dt-nav a{color:var(--muted);text-decoration:none;padding:0 10px;height:40px;display:flex;align-items:center;border-bottom:2px solid transparent}
#dt-nav a:hover{color:var(--text);background:var(--soft)}
#dt-nav .dt-nav-home{color:var(--blue);font-weight:600;padding-left:0}
#dt-nav .dt-nav-home:hover{background:var(--blue-s)}
#dt-nav .dt-nav-sep{flex:1}
#dt-nav .dt-nav-proj{font-size:12.5px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body:has(#dt-nav) .wrap{padding-top:16px}
.dt-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.dt-head h1{font-size:24px;margin:0;font-weight:650}
.dt-head h1 small{font-size:14px;color:var(--muted);font-weight:400;margin-left:8px}
.dt-head .sub{font-size:13.5px;color:var(--muted);margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
button:hover{background:var(--soft)}
button:focus-visible,[contenteditable]:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.ghost{border-style:dashed;color:var(--muted);font-size:13px;min-height:32px;padding:4px 10px}
button.icon{border:0;background:transparent;color:var(--muted);width:28px;height:28px;min-height:28px;padding:0;border-radius:6px;font-size:16px;line-height:1}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0}
.seg button[aria-pressed=true]{background:var(--surface);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--orange-s);color:var(--orange);font-weight:550;white-space:nowrap}
button.badge{border:0;min-height:0;cursor:pointer;font:inherit;font-size:12.5px;font-weight:550}button.badge:hover{filter:brightness(.96)}
.badge.ok{background:var(--green-s);color:var(--green)}
.badge.info{background:var(--blue-s);color:var(--blue)}
.badge.mute{background:var(--surface);color:var(--muted)}
.box{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--bg)}
.box.soft{background:var(--soft)}
.sec{font-size:17px;font-weight:650;margin:28px 0 4px}
.secsub{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.hint{font-size:12.5px;color:var(--muted)}
.card{position:relative;background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:8px 32px 8px 10px}
.card>.icon.del{position:absolute;top:4px;right:4px}
.ed{outline:none;min-height:1.4em;word-break:break-word}
.ed:empty:before{content:attr(data-ph);color:var(--muted)}
.ev{font-size:12px;border:0;padding:1px 8px;min-height:22px;border-radius:999px;cursor:pointer}
.ev.quote{background:var(--blue-s);color:var(--blue)}.ev.observed{background:var(--green-s);color:var(--green)}
.ev.inferred{background:var(--purple-s);color:var(--purple)}.ev.assumed{background:var(--orange-s);color:var(--orange)}
input,select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 8px;min-height:36px;max-width:100%}
textarea{resize:vertical}
.core{border-radius:12px;padding:16px 20px;background:var(--blue-s);border-left:4px solid var(--blue)}
.core .lbl{font-size:13px;color:var(--blue);font-weight:650;margin-bottom:4px}
.core .ed{font-size:16px;font-weight:550}
.verify{border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-top:16px}
.verify ul{margin:6px 0 0;padding-left:20px}.verify li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.open{display:flex}
.modal .panel{background:var(--bg);border-radius:12px;padding:20px;width:min(640px,100%);box-shadow:0 4px 24px rgba(0,0,0,.18)}
.modal textarea{width:100%;min-height:220px;font-family:Menlo,Consolas,monospace;font-size:12.5px}
.empty{color:var(--muted);font-size:14px;padding:12px;border:1px dashed var(--border);border-radius:8px;text-align:center}
.foot{margin-top:40px;font-size:12.5px;color:var(--muted);text-align:center}
.foot a{color:var(--muted)}
/* AI 辅助面板（desk research 等页面） */
.aip{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:20px 0 0;background:var(--soft)}
.aip-hd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px}
.aip-btns{display:flex;flex-wrap:wrap;gap:8px}
.aip-rv{border-color:var(--orange);color:var(--orange)}
.aip-box{display:none;margin:10px 0 0;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:13px/1.7 inherit;font-family:inherit;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.aip-box.open{display:block}
.srcs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px}
.src-chip{font-size:11.5px;min-height:22px;padding:0 8px;border-radius:999px;border:0;background:var(--blue-s);color:var(--blue)}
.src-chip.miss{background:var(--red-s);color:var(--red)}
.src-add{font-size:12px;min-height:24px;padding:0 4px;max-width:180px;color:var(--muted)}
@media (max-width:720px){.wrap{padding:16px}.dt-head h1{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.tab{border-radius:999px;padding:6px 14px}
.tab[aria-selected=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.poster{display:grid;grid-template-columns:300px 1fr;gap:16px}
.idc{background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.ava{width:120px;height:120px;border-radius:50%;background:var(--blue-s);color:var(--blue);display:grid;place-items:center;font-size:52px;font-weight:700;overflow:hidden;align-self:center}
.ava img{width:100%;height:100%;object-fit:cover}
.pname{font-size:22px;font-weight:700;text-align:center}
.snap{font-size:14px;color:var(--muted);text-align:center}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px}
.tag .icon{width:20px;height:20px;min-height:20px;font-size:13px}
.quote{font-size:16px;font-weight:600;border-left:4px solid var(--orange);padding:6px 12px;background:var(--orange-s);border-radius:0 8px 8px 0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.fld h3{font-size:15px;margin:0 0 2px;display:flex;gap:8px;align-items:baseline}
.fld h3 .n{font-size:12px;color:var(--muted);font-weight:500}
.fld .hint{margin-bottom:8px}
.fld .cards{display:flex;flex-direction:column;gap:6px}
.fld.wide{grid-column:1/-1}
.job{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:start;margin-bottom:6px}
.job b{font-size:12.5px;padding:2px 0;border-radius:6px;text-align:center}
.job .f{background:var(--blue-s);color:var(--blue)}.job .e{background:var(--orange-s);color:var(--orange)}.job .s{background:var(--purple-s);color:var(--purple)}
.job .ed{background:var(--soft);border-radius:8px;padding:4px 8px}
.tl{display:flex;flex-direction:column;gap:0}
.tli{display:grid;grid-template-columns:70px 14px 1fr 28px;gap:8px;align-items:start;padding:4px 0}
.tli .tm{font-family:Menlo,Consolas,monospace;font-size:13px;color:var(--muted);text-align:right}
.tli .dot{width:10px;height:10px;border-radius:50%;background:var(--green);margin-top:6px;box-shadow:0 0 0 3px var(--green-s)}
.mot{font-size:15px;font-weight:600;color:var(--green)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.step{border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;background:var(--bg);text-align:left;min-height:92px;display:flex;flex-direction:column;gap:4px}
.step .no{font-size:12px;color:var(--muted)}
.step .nm{font-weight:600;font-size:14px}
.step .q{font-size:12px;color:var(--muted);line-height:1.4}
.step.done{background:var(--green-s);border-color:transparent}
.step.done .no:after{content:" ✓ 已完成";color:var(--green);font-weight:600}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th,.cmp td{border:1px solid var(--border);padding:8px 10px;vertical-align:top;text-align:left}
.cmp th{background:var(--soft);font-weight:600;width:110px}
.cmpw{overflow-x:auto}
.prompt{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.prompt .ed{flex:1;font-size:13px;background:var(--soft);border-radius:8px;padding:6px 8px;color:var(--muted)}
@media (max-width:860px){.poster{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
</style>
</head>
<body data-tpl="persona">
<div class="wrap">
<header class="dt-head" id="dt-head"></header>
<main id="app"></main>
<div class="foot">设计思维 Skill · 修改会自动保存在本浏览器 · 点「复制给 AI」把结果带回对话</div>
</div>
<script id="dt-data" type="application/json">/*DT_DATA*/</script>
<script>
const DT=(function(){
 const REG={"phases":[{"k":"empathize","n":"共情","en":"Empathize"},{"k":"define","n":"定义视角","en":"Point of View"},{"k":"ideate","n":"构思","en":"Ideate"},{"k":"prototype","n":"原型","en":"Prototype"},{"k":"test","n":"测试","en":"Test"},{"k":"reflect","n":"反思","en":"Reflect"}],"tools":[{"phase":"empathize","name":"用户画像 Persona","file":"persona.html","tpl":"persona","path":["personas","personaSteps"],"check":["personas","persona"],"core":1,"desc":"10 步法 + 画像画布，描述典型用户","when":"有了初步观察/访谈之后"},{"phase":"empathize","name":"移情图 Empathy Map","file":"empathy-map.html","tpl":"empathy-map","path":["empathyMap"],"check":["empathyMap"],"core":1,"desc":"看/听/说/做/想/感 + 痛点与收获","when":"整理访谈与观察记录"},{"phase":"empathize","name":"顾客旅程图","file":"journey.html","tpl":"journey","path":["journey"],"check":["journey.stages"],"core":1,"desc":"分阶段的行为、触点、情绪曲线与机会点","when":"理解完整体验与断点"},{"phase":"empathize","name":"Hook 上瘾模型","file":"hook.html","tpl":"hook","path":["hook"],"check":["hook"],"core":1,"desc":"触发-行动-奖赏-投入，含伦理检查","when":"研究习惯与持续使用"},{"phase":"empathize","name":"AEIOU 观察","file":"board-aeiou.html","tpl":"board","path":["boards.aeiou"],"check":["boards.aeiou.cards"],"core":2,"desc":"按活动/环境/互动/物体/用户结构化记录观察","when":"进入现场观察前与观察中"},{"phase":"empathize","name":"访谈提纲","file":"table-interview.html","tpl":"table","path":["tables.interview"],"check":["tables.interview.rows","tables.interview.questions","tables.interview.items"],"core":2,"desc":"开放式问题 + 追问“为什么” + 例外","when":"真人访谈前准备"},{"phase":"empathize","name":"AEIOU 问卷","file":"table-survey.html","tpl":"table","path":["tables.survey"],"check":["tables.survey.rows","tables.survey.questions","tables.survey.items"],"core":2,"desc":"按五维度设计问卷，验证访谈发现有多普遍","when":"访谈之后、需要量化验证时"},{"phase":"empathize","name":"利益相关者地图","file":"radial-stakeholders.html","tpl":"radial","path":["radials.stakeholders"],"check":["radials.stakeholders.items","radials.stakeholders.petals"],"core":2,"desc":"谁使用、谁付钱、谁决定、谁受影响（补充工具）","when":"项目开始、涉及多方时"},{"phase":"empathize","name":"极端 / 未来用 (function(){

function render(){const app=document.getElementById('app');app.innerHTML='';const ps=P();b1.setAttribute('aria-pressed',view==='card');b2.setAttribute('aria-pressed',view==='cmp');

 if(!ps.length){app.appendChild(h('div',{class:'empty'},'还没有用户画像，点「+ 新画像」开始。'))}
 else if(view==='cmp')app.appendChild(compare(ps));else app.appendChild(card(ps[cur],ps));
 app.appendChild(h('h3',{class:'sec'},'构建画像的 10 个步骤'));app.appendChild(h('p',{class:'secsub'},'点击标记完成。画像是迭代出来的，每一轮都会更清晰。'));
 const sw=h('div',{class:'steps'});steps().forEach((s,i)=>{const b=h('button',{class:'step'+(s.done?' done':''),'aria-pressed':String(!!s.done)},'<span class="no">第 '+(i+1)+' 步</span><span class="nm">'+STEPS[i][0]+'</span><span class="q">'+STEPS[i][1]+'</span>');b.onclick=()=>{s.done=!s.done;save();render()};sw.appendChild(b)});app.appendChild(sw)}
function card(p,ps){p.jobs=p.jobs||{};p.tags=p.tags||[];p.pains=p.pains||[];p.behaviors=p.behaviors||[];
 const w=h('div',{class:'poster'});const id=h('div',{class:'idc'});

 id.appendChild(ed(h('div',{class:'pname'}),p,'name','名字或昵称',()=>{const t=document.querySelectorAll('.tab')[cur];if(t)t.textContent=p.name}));
 id.appendChild(ed(h('div',{class:'snap'}),p,'snapshot','年龄 · 城市 · 职业 · 收入 · 家庭'));
 const tg=h('div',{class:'tags'});p.tags.forEach((t,i)=>{const e=h('span',{class:'tag'},esc(t));const x=h('button',{class:'icon','aria-label':'删除标签'},'×');x.onclick=()=>{p.tags.splice(i,1);save();render()};e.appendChild(x);tg.appendChild(e)});
 const at=h('button',{class:'ghost'},'+ 标签');at.onclick=()=>{const v=prompt('新标签（3–5 个关键词为宜）');if(v){p.tags.push(v.trim());save();render()}};tg.appendChild(at);id.appendChild(tg);
 id.appendChild(ed(h('div',{class:'quote'}),p,'quote','一句带情绪的代表性引言'));
 const pr=h('div',{},'<div class="hint">配图提示词（交给生图 AI，再把图片地址填回 image 字段）</div>');const pw=h('div',{class:'prompt'});const pe=ed(h('div'),p,'imagePrompt','描述外貌、场景、风格……');pw.appendChild(pe);const cb=h('button',{},'复制');cb.onclick=()=>DT.copy(p.imagePrompt||'');pw.appendChild(cb);pr.appendChild(pw);id.appendChild(pr);
 const del=h('button',{class:'ghost',style:'align-self:center'},'删除此画像');del.onclick=()=>{if(confirm('删除「'+p.name+'」？')){ps.splice(cur,1);save();render()}};id.appendChild(del);
 w.appendChild(id);
 const f=h('div',{class:'fields'});
 const jb=h('div',{class:'fld wide'},'<h3>目标 & 需求<span class="n">Jobs-to-be-Done · 用第一人称“我想……”</span></h3><div class="hint">区分功能型、情感型、社交型需求</div>');
 [['functional','功能','f'],['emotional','情感','e'],['social','社交','s']].forEach(([k,l,c])=>{const r=h('div',{class:'job'},'<b class="'+c+'">'+l+'</b>');r.appendChild(ed(h('div'),p.jobs,k,'我想……'));jb.appendChild(r)});f.appendChild(jb);
 const pn=h('div',{class:'fld'},'<h3>痛点 & 阻力<span class="n">2–4 条</span></h3><div class="hint">“现有方案让我……”</div>');const pc=h('div',{class:'cards'});pn.appendChild(pc);DT.list(pc,p.pains,'pn','现有方案让我……');f.appendChild(pn);
 const mo=h('div',{class:'fld'},'<h3>动机 / 价值取向</h3><div class="hint">行为背后的 WHY：省时间？彰显身份？社群认同？</div>');mo.appendChild(ed(h('div',{class:'mot'}),p,'motivation','一句话提炼'));f.appendChild(mo);

 const ab=h('button',{class:'ghost',style:'margin-top:6px'},'+ 时间点');ab.onclick=()=>{p.behaviors.push({time:'',action:''});save();render()};bh.append(tl,ab);f.appendChild(bh);
 w.appendChild(f);return w}
function compare(ps){const rows=[['基本信息',p=>p.snapshot],['标签',p=>(p.tags||[]).join('、')],['功能需求',p=>(p.jobs||{}).functional],['情感需求',p=>(p.jobs||{}).emotional],['社交需求',p=>(p.jobs||{}).social],['痛点',p=>(p.pains||[]).map(x=>'· '+x.text).join('<br>')],['动机',p=>p.motivation],['引言',p=>p.quote]];
 const t=h('table',{class:'cmp'});t.innerHTML='<thead><tr><th></th>'+ps.map(p=>'<th style="width:auto">'+esc(p.name)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(([l,f])=>'<tr><th>'+l+'</th>'+ps.map(p=>'<td>'+(l==='痛点'?(f(p)||''):esc(f(p)||''))+'</td>').join('')+'</tr>').join('')+'</tbody>';
 const w=h('div',{class:'cmpw'});w.appendChild(t);return w}
function md(){return P().map(p=>['# '+p.name,'> '+(p.quote||''),'','- 基本信息：'+(p.snapshot||''),'- 标签：'+(p.tags||[]).join('、'),'- 功能需求：'+((p.jobs||{}).functional||''),'- 情感需求：'+((p.jobs||{}).emotional||''),'- 社交需求：'+((p.jobs||{}).social||''),'- 痛点：'+(p.pains||[]).map(x=>x.text).join('；'),'- 动机：'+(p.motivation||''),'','## 典型一天',...(p.behaviors||[]).map(b=>'- '+b.time+' '+b.action),''].join('\n')).join('\n')}
DT.boot({title:'用户画像',en:'Persona Canvas',subtitle:()=>P().length+' 个画像',extra:[vt],render,md});
