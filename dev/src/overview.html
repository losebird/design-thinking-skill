<!-- title: 项目总览 -->
<style>
.chal{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline;margin-bottom:8px}
.chal .ed{font-size:16px;font-weight:600;border-bottom:1px dashed var(--border)}
.cyc{display:flex;align-items:stretch;gap:0;margin:8px 0 4px;overflow-x:auto;padding:6px 2px 4px}
.ph{flex:1;min-width:118px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--bg);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px;position:relative}
.ph:hover{background:var(--soft)}
.ph.on{box-shadow:0 0 0 2px var(--c);border-color:var(--c)}
.ph.cur:after{content:"当前";position:absolute;top:-9px;right:10px;font-size:11.5px;background:var(--c);color:#fff;border-radius:999px;padding:0 8px}
.ph b{font-size:15px}.ph .en{font-size:12px;color:var(--muted)}
.ph .bar{height:6px;border-radius:3px;background:var(--surface);overflow:hidden;margin-top:auto}
.ph .bar i{display:block;height:100%;background:var(--c)}
.ph .cnt{font-size:12px;color:var(--muted)}
.arr{align-self:center;color:var(--muted);padding:0 4px;font-size:18px;flex:none}
.loop{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:2px 0 0}
.loop svg{flex:none}
.macro{display:grid;grid-template-columns:1fr 54px 1fr;margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.macro button{border:0;border-radius:0;min-height:64px;text-align:left;padding:10px 14px;background:var(--soft);transition:background .15s,color .15s}
.macro button[aria-pressed=true]{background:var(--blue);color:#fff;font-weight:600}
.macro button[aria-pressed=true] small{color:rgba(255,255,255,.8)}
.macro button[aria-pressed=true].pv{background:var(--blue)}
.macro .pv{text-align:center;padding:10px 0;font-size:12.5px;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.macro small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.flt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.flt input{flex:1;min-width:180px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tl{border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--c)}
.tl .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tl .t b{font-size:15px}
.tl .u{font-size:13.5px;color:var(--muted);flex:1}
.tl .w{font-size:12.5px;color:var(--muted)}
.tl .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl a.open{font-size:13.5px;color:var(--blue);text-decoration:none;border:1px solid var(--blue);border-radius:8px;padding:4px 10px}
.tl a.open:hover{background:var(--blue-s)}
.tl button{min-height:30px;padding:3px 10px;font-size:13px}
.vf li .src{font-size:12px;color:var(--muted);margin-left:6px}
@media (max-width:720px){.cyc{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:visible}.cyc .arr{display:none}.ph{min-width:0;min-height:84px}.macro{grid-template-columns:1fr}.macro .pv{border:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}}
</style>
<script>
(function(){
const {h,esc,save,ed}=DT;
const PH=[
 {k:'empathize',n:'共情',en:'Empathize',c:'var(--blue)',d:'理解与观察用户，摆脱自身假设'},
 {k:'define',n:'定义视角',en:'Point of View',c:'var(--purple)',d:'把发现收敛成清晰的问题陈述'},
 {k:'ideate',n:'构思',en:'Ideate',c:'var(--orange)',d:'先求多，再收敛出最有潜力的点子'},
 {k:'prototype',n:'原型',en:'Prototype',c:'var(--green)',d:'尽早、简单、便宜地做出来'},
 {k:'test',n:'测试',en:'Test',c:'var(--teal)',d:'以学习为目的，验证假设'},
 {k:'reflect',n:'反思',en:'Reflect',c:'var(--pink)',d:'每个小循环后回溯、改进'}];
const has=(o)=>{if(o==null)return false;if(Array.isArray(o))return o.length>0;if(typeof o==='object')return Object.keys(o).some(k=>k!=='id'&&has(o[k]));return String(o).trim()!==''&&o!==false&&o!==0};
// 工具清单来自 tools.json（DT.TOOLS）
const TOOLS=DT.TOOLS.map(t=>[t.phase,t.name,t.desc,t.when,t.file,s=>DT.hasData(t,s),t.path[0],t.core]);
let sel=null,q='',fm='all';
function verifyList(s){const out=[];(function walk(o,p){if(!o||typeof o!=='object')return;for(const k in o){if(k==='toVerify'&&Array.isArray(o[k]))o[k].forEach(v=>out.push({t:typeof v==='string'?v:(v.text||''),p}));else walk(o[k],p?p+'.'+k:k)}})(s,'');return out.filter(x=>x.t)}
function render(){const s=DT.st,app=document.getElementById('app');app.innerHTML='';s.meta.phase=s.meta.phase||'empathize';
 const c=h('div',{class:'chal'});c.appendChild(h('span',{class:'hint'},'设计挑战'));c.appendChild(ed(h('div'),s.meta,'challenge','我们要为谁解决什么问题？'));app.appendChild(c);
 app.appendChild(h('div',{class:'sec'},'微观循环'));app.appendChild(h('p',{class:'secsub'},'点击阶段筛选下方工具；双击设为“当前阶段”。回溯箭头代表随时可以回到前面的阶段迭代。'));
 const cy=h('div',{class:'cyc',role:'group','aria-label':'设计思维阶段'});
 PH.forEach((p,i)=>{const ts=TOOLS.filter(t=>t[0]===p.k),done=ts.filter(t=>t[5](s)).length;
  const b=h('button',{class:'ph'+(sel===p.k?' on':'')+(s.meta.phase===p.k?' cur':''),style:'--c:'+p.c,'aria-pressed':sel===p.k?'true':'false',title:p.d+'（双击设为当前阶段）'},'<b>'+p.n+'</b><span class="en">'+p.en+'</span><span class="cnt">'+done+' / '+ts.length+' 个工具有内容</span><span class="bar"><i style="width:'+(ts.length?done/ts.length*100:0)+'%"></i></span>');
  b.onclick=()=>{sel=sel===p.k?null:p.k;render()};b.ondblclick=()=>{s.meta.phase=p.k;save();render()};
  cy.appendChild(b);if(i<PH.length-1)cy.appendChild(h('span',{class:'arr','aria-hidden':'true'},'→'))});
 app.appendChild(cy);
 app.appendChild(h('div',{class:'loop'},'<svg width="40" height="16" viewBox="0 0 40 16" aria-hidden="true"><path d="M36 4 H8 a4 4 0 0 0 0 8 H30" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M27 9 l4 3 -4 3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>每个阶段都可能把你带回更早的阶段——这是正常的迭代，不是失败。'));
 app.appendChild(h('div',{class:'sec'},'宏观循环'));app.appendChild(h('p',{class:'secsub'},'整个项目先发散、后收敛；原型保真度随之从低到高。点击标记项目所处位置。'));
 const mc=h('div',{class:'macro'});const M=[['diverge','发散阶段','理解问题空间，探索多种方向与愿景'],['pivot','转折点','选定方向'],['converge','收敛阶段','功能原型 → 完整原型 → 最终原型 / MVP']];
 const macroLabels={'diverge':'发散阶段','pivot':'转折点','converge':'收敛阶段'};
 M.forEach(m=>{const sel=s.meta.macro===m[0];const b=h('button',{'aria-pressed':sel?'true':'false',class:m[0]==='pivot'?'pv':''},m[1]+(m[0]==='pivot'?'':'<small>'+m[2]+'</small>'));b.title=m[2];b.onclick=()=>{if(s.meta.macro===m[0])return;s.meta.macro=m[0];save();render();DT.toast('已标记为：'+macroLabels[m[0]])};mc.appendChild(b)});app.appendChild(mc);
 // 项目状态卡片（嵌入式仪表盘）
 const totalT=TOOLS.length,doneT=TOOLS.filter(t=>t[5](s)).length;
  const coreT=TOOLS.filter(t=>t[7]===1),coreDoneT=coreT.filter(t=>t[5](s)).length;
 const vl2=[];(function wk(o,p){if(!o||typeof o!=='object')return;for(const k in o){if(k==='toVerify'&&Array.isArray(o[k]))o[k].forEach(v=>vl2.push(typeof v==='string'?v:(v.text||'')));else wk(o[k],p?p+'.'+k:k)}})(s,'');
 const pCard=h('div',{style:'border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px;background:var(--bg)'});
 const pHd=h('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px'});
 pHd.appendChild(h('b',{style:'font-size:15px'},'📊 项目完成度'));
 const dbLink=h('a',{href:'dashboard.html',style:'font-size:13px;color:var(--blue);text-decoration:none;border:1px solid var(--blue);border-radius:8px;padding:3px 10px'},'打开仪表盘 →');
 pHd.appendChild(dbLink);
 pCard.appendChild(pHd);
 const pRow=h('div',{style:'display:grid;grid-template-columns:repeat(4,1fr);gap:8px'});
 [[doneT+'/'+totalT,'已完成工具','var(--blue)'],[coreDoneT+'/'+coreT.length,'核心工具','var(--green)'],[vl2.filter(Boolean).length,'待验证项','var(--orange)'],[(PH.find(p=>p.k===s.meta.phase)||PH[0]).n,'当前阶段','var(--purple)']].forEach(([val,label,c])=>{
   const cell=h('div',{style:'border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--surface)'});
   cell.appendChild(h('div',{style:'font-size:20px;font-weight:750;color:'+c},String(val)));
   cell.appendChild(h('div',{style:'font-size:11.5px;color:var(--muted)'},label));
   pRow.appendChild(cell);
 });
 pCard.appendChild(pRow);
 // 下一步一句话建议
 const hasPOV=has(s.define),hasPersona=has(s.personas),hasMatrix=has(s.ideate&&s.ideate.matrix&&s.ideate.matrix.items),hasProto=has(s.prototype)||(s.boards&&has(s.boards.mvp&&s.boards.mvp.cards)),hasRP=has(s.researchPlan&&s.researchPlan.hypotheses);
 let hint='';
 if(!hasPersona) hint='建议下一步：生成用户画像 → <a href="persona.html" style="color:var(--blue)">persona.html</a>';
 else if(!hasPOV) hint='建议下一步：写出 POV 洞察句 → <a href="pov.html" style="color:var(--blue)">pov.html</a>';
 else if(!hasMatrix) hint='建议下一步：用丘吉尔矩阵筛选方案 → <a href="matrix.html" style="color:var(--blue)">matrix.html</a>';
 else if(!hasProto) hint='建议下一步：制作 MVP 画布 → <a href="board-mvp.html" style="color:var(--blue)">board-mvp.html</a>';
 else if(!hasRP) hint='建议下一步：制定用户研究计划 → <a href="research-plan.html" style="color:var(--blue)">research-plan.html</a>';
 else hint='全部核心工具已有内容 🎉  继续迭代或打开 <a href="dashboard.html" style="color:var(--blue)">仪表盘</a> 查看摘要。';
 if(hint){const hn=h('div',{style:'margin-top:10px;font-size:13.5px;padding:8px 10px;border-radius:8px;background:var(--blue-s);color:var(--blue)'});hn.innerHTML=hint;pCard.appendChild(hn);}
 app.appendChild(pCard);
 app.appendChild(h('div',{class:'sec'},'工具速查表'));app.appendChild(h('p',{class:'secsub'},'已有内容的工具可直接打开；未开始的工具可复制一句话交给 agent 生成。'));
 const f=h('div',{class:'flt'});const inp=h('input',{type:'search',placeholder:'搜索工具、用途或场景…','aria-label':'搜索工具'});inp.value=q;inp.oninput=()=>{q=inp.value;grid()};f.appendChild(inp);
 const sg=h('div',{class:'seg'});[['all','全部'],['done','有内容'],['todo','未开始']].forEach(o=>{const b=h('button',{'aria-pressed':fm===o[0]?'true':'false'},o[1]);b.onclick=()=>{fm=o[0];render()};sg.appendChild(b)});f.appendChild(sg);app.appendChild(f);
 const g=h('div',{class:'tg'});app.appendChild(g);
 function grid(){g.innerHTML='';let n=0;
  TOOLS.forEach(t=>{if(sel&&t[0]!==sel)return;const ok=t[5](s);if(fm==='done'&&!ok||fm==='todo'&&ok)return;if(q&&(t.slice(1,5).join(' ')).toLowerCase().indexOf(q.toLowerCase())<0)return;n++;
   const p=PH.find(x=>x.k===t[0]);const d=h('div',{class:'tl',style:'--c:'+p.c});
   d.innerHTML='<div class="t"><b>'+esc(t[1])+'</b>'+(ok?'<span class="badge ok">有内容</span>':'<span class="badge mute">未开始</span>')+'</div><div class="u">'+esc(t[2])+'</div><div class="w">何时用：'+esc(t[3])+' · '+p.n+'</div>';
   const a=h('div',{class:'act'});
   if(ok||(DT.pages&&DT.pages.indexOf(t[4])>=0))a.appendChild(h('a',{class:'open',href:t[4]},(ok?'打开 ':'打开空白页 ')+esc(t[4])));
   const cp=h('button',{},ok?'复制继续指令':'复制生成指令');cp.onclick=()=>DT.copy((ok?'请基于当前项目数据继续完善「':'请用设计思维 skill 为当前项目生成「')+t[1]+'」（数据路径 '+t[6]+'，输出 '+t[4]+'）。','已复制，粘贴给 agent');a.appendChild(cp);
   d.appendChild(a);g.appendChild(d)});
  if(!n)g.appendChild(h('div',{class:'empty'},'没有匹配的工具'))}
 grid();
 const vl=verifyList(s);const v=h('div',{class:'verify vf'});v.innerHTML='<b>待真人验证（'+vl.length+'）</b><div class="hint">汇总自各工具的 toVerify 清单。AI 生成的内容只是假设，务必找真实用户验证。</div>'+(vl.length?'<ul>'+vl.map(x=>'<li>'+esc(x.t)+'<span class="src">'+esc(x.p)+'</span></li>').join('')+'</ul>':'<div class="hint" style="margin-top:6px">暂无</div>');app.appendChild(v)}
function md(){const s=DT.st;const L=['# '+(s.meta.project||'设计思维项目')+' · 总览','','设计挑战：'+(s.meta.challenge||''),'','当前阶段：'+((PH.find(p=>p.k===s.meta.phase)||{}).n||''),'','| 阶段 | 工具 | 状态 | 文件 |','|---|---|---|---|'];
 TOOLS.forEach(t=>L.push('| '+PH.find(p=>p.k===t[0]).n+' | '+t[1]+' | '+(t[5](s)?'有内容':'未开始')+' | '+t[4]+' |'));
 const vl=verifyList(s);if(vl.length){L.push('','## 待真人验证');vl.forEach(x=>L.push('- [ ] '+x.t))}return L.join('\n')}
DT.boot({title:'项目总览',en:'Design Thinking Overview',subtitle:()=>'生命周期导航 · 工具速查',render,md});
})();
</script>
